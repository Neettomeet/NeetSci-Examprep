<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NeetSci-Examprep</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-page: #F8FAFC;
            --bg-card: #FFFFFF;
            --text-main: #0F172A;
            --text-sub: #64748B;
            --border-color: #E2E8F0;
            --header-bg: #FFFFFF;
            --pill-bg: #F1F5F9;

            --bio-color: #16A34A;
            --bio-bg: linear-gradient(135deg, #F0FDF4 0%, #DCFCE7 100%);
            --bio-border: #22C55E;
            --bio-pill-bg: #DCFCE7;
            --bio-pill-text: #15803D;

            --phy-color: #2563EB;
            --phy-bg: linear-gradient(135deg, #EFF6FF 0%, #DBEAFE 100%);
            --phy-border: #3B82F6;
            --phy-pill-bg: #DBEAFE;
            --phy-pill-text: #1D4ED8;

            --che-color: #9333EA;
            --che-bg: linear-gradient(135deg, #FAF5FF 0%, #F3E8FF 100%);
            --che-border: #A855F7;
            --che-pill-bg: #F3E8FF;
            --che-pill-text: #7E22CE;

            --negative-red: #EF4444;
            --negative-bg: #FEF2F2;
            --card-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.04);
            --font-main: 'Plus Jakarta Sans', -apple-system, sans-serif;
        }

        [data-theme="dark"] {
            --bg-page: #031428;
            --bg-card: #081E36;
            --text-main: #FFFFFF;
            --text-sub: #94A3B8;
            --border-color: #1E293B;
            --header-bg: #031428;
            --pill-bg: #0F2942;

            --bio-bg: linear-gradient(135deg, #064E3B 0%, #022C22 100%);
            --bio-pill-bg: rgba(6, 78, 59, 0.6);
            --bio-pill-text: #4ADE80;

            --phy-bg: linear-gradient(135deg, #1E3A8A 0%, #172554 100%);
            --phy-pill-bg: rgba(30, 58, 138, 0.6);
            --phy-pill-text: #60A5FA;

            --che-bg: linear-gradient(135deg, #581C87 0%, #3B0764 100%);
            --che-pill-bg: rgba(88, 28, 135, 0.6);
            --che-pill-text: #C084FC;

            --negative-red: #F87171;
            --negative-bg: #450A0A;
            --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-main);
            -webkit-tap-highlight-color: transparent;
            transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
        }

        html, body {
            margin: 0 !important;
            padding: 0 !important;
            width: 100% !important;
            min-height: 100vh;
            background-color: var(--bg-page);
            overflow-x: hidden;
        }

        body {
            color: var(--text-main);
            display: flex;
            justify-content: center;
            padding-bottom: 80px !important;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background-color: var(--bg-page);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            margin: 0 auto;
        }

        header {
            background-color: var(--header-bg);
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .menu-icon-btn {
            background: none;
            border: none;
            font-size: 1.3rem;
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brand-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-logo-circle {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(22, 163, 74, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        .brand-title {
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .brand-title span {
            color: var(--bio-color);
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .notification-icon-btn {
            background: var(--pill-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            cursor: pointer;
            position: relative;
        }

        .notification-badge {
            position: absolute;
            top: 6px;
            right: 6px;
            width: 8px;
            height: 8px;
            background-color: var(--negative-red);
            border-radius: 50%;
        }

        .profile-avatar-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            overflow: hidden;
            border: 1.5px solid var(--border-color);
            cursor: pointer;
            background: #E2E8F0;
        }

        .profile-avatar-btn img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .select-lang {
            background-color: var(--pill-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            outline: none;
        }

        .theme-toggle-btn {
            background: var(--pill-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            cursor: pointer;
        }

        .screen {
            display: none;
            flex-direction: column;
            flex: 1;
        }
        .screen.active {
            display: flex;
        }

        /* HOME SCREEN REDESIGN MATCHING DESIGN MOCKUP */
        .home-container {
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .user-greeting-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .greeting-text h2 {
            font-size: 1.45rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text-main);
        }

        .greeting-text p {
            font-size: 0.85rem;
            color: var(--text-sub);
            font-weight: 500;
            margin-top: 2px;
        }

        .streak-pill {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 6px 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: var(--card-shadow);
        }

        .streak-icon { font-size: 1rem; }
        .streak-count { font-size: 0.9rem; font-weight: 800; color: var(--text-main); }
        .streak-label { font-size: 0.72rem; color: var(--text-sub); font-weight: 600; display: block; line-height: 1; }

        .section-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2px;
        }

        .section-title {
            font-size: 1.05rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .view-all-link {
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--bio-color);
            cursor: pointer;
            background: none;
            border: none;
        }

        .overall-progress-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 16px;
            box-shadow: var(--card-shadow);
            display: grid;
            grid-template-columns: 85px 1fr;
            gap: 14px;
            align-items: center;
        }

        .progress-ring-box {
            position: relative;
            width: 85px;
            height: 85px;
            border-radius: 50%;
            background: conic-gradient(var(--bio-color) 0% 42%, var(--pill-bg) 42% 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .progress-ring-inner {
            width: 69px;
            height: 69px;
            background-color: var(--bg-card);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .progress-ring-percentage {
            font-size: 1.05rem;
            font-weight: 800;
            color: var(--text-main);
            line-height: 1.1;
        }

        .progress-ring-label {
            font-size: 0.58rem;
            color: var(--text-sub);
            font-weight: 700;
            text-transform: uppercase;
        }

        .progress-stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            text-align: center;
        }

        .prog-stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .prog-stat-icon {
            font-size: 1rem;
            margin-bottom: 2px;
        }

        .prog-stat-num {
            font-size: 0.95rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .prog-stat-label {
            font-size: 0.65rem;
            color: var(--text-sub);
            font-weight: 600;
            line-height: 1.2;
            margin-top: 1px;
        }

        .select-subject-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .sub-mini-card {
            background-color: var(--bg-card);
            border: 1.5px solid var(--border-color);
            border-radius: 16px;
            padding: 14px 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            cursor: pointer;
            box-shadow: var(--card-shadow);
        }

        .sub-mini-card:hover {
            border-color: var(--bio-color);
        }

        .sub-mini-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            background-color: var(--pill-bg);
        }

        .sub-mini-info h4 {
            font-size: 0.9rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .sub-mini-info p {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--text-sub);
            margin-top: 1px;
        }

        .continue-learning-card {
            background: var(--bio-bg);
            border: 1px solid var(--border-color);
            border-left: 5px solid var(--bio-border);
            border-radius: 18px;
            padding: 16px;
            box-shadow: var(--card-shadow);
            position: relative;
        }

        .continue-top-row {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .continue-left-info {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .continue-book-icon {
            font-size: 2rem;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 12px;
            flex-shrink: 0;
        }

        [data-theme="dark"] .continue-book-icon {
            background: rgba(15, 41, 66, 0.7);
        }

        .continue-titles h4 {
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--bio-color);
            letter-spacing: 0.5px;
        }

        .continue-titles h3 {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--text-main);
            margin-top: 1px;
        }

        .continue-titles p {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-sub);
            margin-top: 1px;
        }

        .last-studied-tag {
            background-color: rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
            font-size: 0.68rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 12px;
            color: var(--text-sub);
        }

        [data-theme="dark"] .last-studied-tag {
            background-color: rgba(255, 255, 255, 0.08);
        }

        .continue-progress-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 12px;
            gap: 12px;
        }

        .progress-bar-track {
            flex: 1;
            height: 6px;
            background-color: rgba(0, 0, 0, 0.08);
            border-radius: 3px;
            overflow: hidden;
        }

        [data-theme="dark"] .progress-bar-track {
            background-color: rgba(255, 255, 255, 0.15);
        }

        .progress-bar-fill {
            height: 100%;
            background-color: var(--bio-color);
            border-radius: 3px;
            width: 40%;
        }

        .continue-action-btn {
            background-color: var(--text-main);
            color: var(--bg-card);
            border: none;
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }

        .todays-target-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 16px;
            box-shadow: var(--card-shadow);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .target-content-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .target-left-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .target-icon-box {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: var(--pill-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .target-texts h4 {
            font-size: 0.92rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .target-texts p {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--bio-color);
            margin-top: 1px;
        }

        .start-practice-btn {
            background-color: transparent;
            border: 1.5px solid var(--bio-color);
            color: var(--bio-color);
            padding: 7px 14px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }

        .quick-practice-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }

        .quick-item {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 12px 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
            box-shadow: var(--card-shadow);
        }

        .quick-item:hover {
            border-color: var(--bio-color);
        }

        .quick-icon-wrap {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: var(--pill-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            margin-bottom: 6px;
        }

        .quick-label {
            font-size: 0.68rem;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.2;
        }

        .study-assistant-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 16px;
            box-shadow: var(--card-shadow);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .assistant-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .assistant-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3B82F6 0%, #1D4ED8 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(37, 99, 235, 0.3);
        }

        .assistant-texts {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .assistant-title-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .assistant-title-row h4 {
            font-size: 0.95rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .ai-badge {
            background-color: rgba(37, 99, 235, 0.12);
            color: var(--phy-color);
            font-size: 0.62rem;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 6px;
        }

        .assistant-texts p {
            font-size: 0.76rem;
            color: var(--text-sub);
            font-weight: 500;
            line-height: 1.3;
        }

        .ask-now-btn {
            background-color: var(--phy-color);
            color: #FFFFFF;
            border: none;
            padding: 9px 14px;
            border-radius: 14px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
        }
