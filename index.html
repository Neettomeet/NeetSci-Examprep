<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NeetSci-Examprep</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-page: #F4F7FB;
            --bg-card: #FFFFFF;
            --text-main: #0F172A;
            --text-sub: #475569;
            --accent-green: #10B981;
            --accent-green-bg: #ECFDF5;
            --accent-green-border: #059669;
            --border-color: #E2E8F0;
            --header-bg: #FFFFFF;
            --pill-bg: #F1F5F9;
            --negative-red: #EF4444;
            --negative-bg: #FEF2F2;
            --card-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.05);
            --font-main: 'Plus Jakarta Sans', -apple-system, sans-serif;
        }

        [data-theme="dark"] {
            --bg-page: #031428;
            --bg-card: #081E36;
            --text-main: #FFFFFF;
            --text-sub: #94A3B8;
            --accent-green: #22C55E;
            --accent-green-bg: #064E3B;
            --accent-green-border: #10B981;
            --border-color: #1E293B;
            --header-bg: #031428;
            --pill-bg: #0F2942;
            --negative-red: #F87171;
            --negative-bg: #450A0A;
            --card-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-main);
            -webkit-tap-highlight-color: transparent;
            transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding-bottom: 80px;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background-color: var(--bg-page);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Top Bar Header */
        header {
            background-color: var(--header-bg);
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
        }

        .brand-title {
            font-size: 1.35rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .brand-title span {
            color: var(--accent-green);
        }

        .brand-subtitle {
            font-size: 0.78rem;
            color: var(--text-sub);
            font-weight: 500;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .select-lang {
            background-color: var(--pill-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            outline: none;
        }

        .theme-toggle-btn {
            background: var(--pill-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            cursor: pointer;
        }

        /* Subject Navigation */
        .subject-nav {
            padding: 14px 20px 8px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .subject-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-icon {
            font-size: 1.3rem;
            cursor: pointer;
            color: var(--text-main);
        }

        .subject-name {
            font-size: 1.25rem;
            font-weight: 800;
        }

        .subject-topic {
            font-size: 0.82rem;
            color: var(--text-sub);
            font-weight: 600;
        }

        /* Status Banner */
        .status-banner {
            padding: 8px 20px 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .badge-pill {
            background-color: var(--pill-bg);
            color: var(--accent-green);
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.92rem;
            border: 1px solid var(--border-color);
        }

        .marks-group {
            display: flex;
            gap: 8px;
        }

        .mark-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.85rem;
        }

        .mark-plus {
            background-color: var(--accent-green-bg);
            color: var(--accent-green);
            border: 1px solid var(--accent-green);
        }

        .mark-minus {
            background-color: var(--negative-bg);
            color: var(--negative-red);
            border: 1px solid var(--negative-red);
        }

        /* Main Content Container - Prioritized Space */
        .main-content {
            padding: 0 16px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Question Card */
        .question-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 22px;
            box-shadow: var(--card-shadow);
        }

        .question-text {
            font-size: 1.25rem;
            font-weight: 700;
            line-height: 1.5;
            color: var(--text-main);
            margin-bottom: 20px;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-item {
            background-color: var(--bg-card);
            border: 1.5px solid var(--border-color);
            border-radius: 16px;
            padding: 16px 18px;
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text-main);
            user-select: none;
        }

        .option-letter {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background-color: var(--pill-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1rem;
            flex-shrink: 0;
            color: var(--text-main);
        }

        .option-item.selected {
            background-color: var(--accent-green-bg);
            border-color: var(--accent-green-border);
            color: var(--accent-green);
        }

        .option-item.selected .option-letter {
            background-color: var(--accent-green);
            color: #FFFFFF;
        }

        .check-icon {
            margin-left: auto;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid var(--accent-green);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-green);
            font-weight: 800;
            font-size: 0.85rem;
        }

        /* Explanation Box - Dynamic Reveal */
        .explanation-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 20px;
            box-shadow: var(--card-shadow);
            display: none; /* Hidden until option clicked or answered */
            animation: fadeIn 0.3s ease-in-out;
        }

        .explanation-card.visible {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .explanation-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .explanation-title {
            color: var(--accent-green);
            font-size: 1.1rem;
            font-weight: 800;
        }

        .bulb-icon {
            font-size: 1.4rem;
        }

        .explanation-body {
            font-size: 0.98rem;
            line-height: 1.6;
            color: var(--text-sub);
            font-weight: 500;
        }

        /* Stats Component */
        .stats-grid {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 16px 20px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            align-items: center;
            text-align: center;
            box-shadow: var(--card-shadow);
        }

        .stat-value {
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--accent-green);
        }

        .stat-label {
            font-size: 0.78rem;
            color: var(--text-sub);
            font-weight: 600;
            margin-top: 2px;
        }

        .progress-circle-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .circle-progress {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: conic-gradient(var(--accent-green) 0%, var(--pill-bg) 0);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 4px;
        }

        .circle-inner {
            width: 46px;
            height: 46px;
            background-color: var(--bg-card);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 0.85rem;
        }

        /* Navigation Buttons */
        .nav-actions {
            display: flex;
            gap: 10px;
            margin-top: 4px;
            margin-bottom: 12px;
        }

        .btn {
            padding: 15px 12px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            flex: 1;
            outline: none;
        }

        .btn-outline {
            background-color: var(--bg-card);
            color: var(--text-main);
        }

        .btn-outline.reviewed {
            border-color: #F59E0B;
            color: #F59E0B;
            background-color: rgba(245, 158, 11, 0.1);
        }

        .btn-primary {
            background-color: var(--accent-green);
            color: #FFFFFF;
            border: none;
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* Fixed Bottom Tab Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            background-color: var(--header-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 100;
        }

        .tab-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-sub);
            font-size: 0.75rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
        }

        .tab-item.active {
            color: var(--accent-green);
        }

        .tab-icon {
            font-size: 1.25rem;
        }
    </style>
</head>
<body data-theme="dark">

<div class="app-container">
    <!-- Top Header -->
    <header>
        <div>
            <div class="brand-title"><span>NeetSci</span>-Examprep</div>
            <div class="brand-subtitle">Your Dream. Our Mission.</div>
        </div>
        <div class="header-controls">
            <select class="select-lang" id="langSelect">
                <option value="EN">🌐 EN</option>
                <option value="HI">🌐 HI</option>
            </select>
            <button class="theme-toggle-btn" id="themeBtn">🌙</button>
        </div>
    </header>

    <!-- Subject Title -->
    <div class="subject-nav">
        <div class="subject-info">
            <span class="back-icon">←</span>
            <div>
                <div class="subject-name">🧪 Biology</div>
                <div class="subject-topic" id="topicText">Human Physiology</div>
            </div>
        </div>
        <div style="font-size: 1.2rem; cursor: pointer;">⋮</div>
    </div>

    <!-- Question Counter -->
    <div class="status-banner">
        <div class="badge-pill" id="qNumText">Question 1 / 3</div>
        <div class="marks-group">
            <div class="mark-badge mark-plus">Marks: +4</div>
            <div class="mark-badge mark-minus">-1 ⊕</div>
        </div>
    </div>

    <!-- Main Question Area -->
    <div class="main-content">
        <!-- Question Card -->
        <div class="question-card">
            <div class="question-text" id="questionText">Loading...</div>
            <div class="options-list" id="optionsContainer"></div>
        </div>

        <!-- Explanation Card (Pops Up on Answer) -->
        <div class="explanation-card" id="explanationCard">
            <div class="explanation-header">
                <div class="explanation-title" id="expTitle">Explanation</div>
                <div class="bulb-icon">💡</div>
            </div>
            <div class="explanation-body" id="expBody"></div>
        </div>

        <!-- Performance Stats -->
        <div class="stats-grid">
            <div>
                <div class="stat-value" id="valAnswered">0</div>
                <div class="stat-label" id="lblAnswered">Answered</div>
            </div>
            <div class="progress-circle-container">
                <div class="circle-progress" id="progressCircle">
                    <div class="circle-inner" id="valProgress">0%</div>
                </div>
                <div class="stat-label" id="lblProgress">Progress</div>
            </div>
            <div>
                <div class="stat-value" id="valRemaining">3</div>
                <div class="stat-label" id="lblRemaining">Remaining</div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="nav-actions">
            <button class="btn btn-outline" id="btnPrev">← Previous</button>
            <button class="btn btn-outline" id="btnReview">🔖 Mark for Review</button>
            <button class="btn btn-primary" id="btnNext">Next →</button>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <div class="tab-item">
            <span class="tab-icon">🏠</span>
            <span id="tabHome">Home</span>
        </div>
        <div class="tab-item active">
            <span class="tab-icon">🎯</span>
            <span id="tabPractice">Practice</span>
        </div>
        <div class="tab-item">
            <span class="tab-icon">📝</span>
            <span id="tabTest">Test</span>
        </div>
        <div class="tab-item">
            <span class="tab-icon">📊</span>
            <span id="tabAnalysis">Analysis</span>
        </div>
        <div class="tab-item">
            <span class="tab-icon">👤</span>
            <span id="tabProfile">Profile</span>
        </div>
    </div>
</div>

<script>
    const questions = [
        {
            topic: { EN: "Human Physiology", HI: "मानव शरीर क्रिया विज्ञान" },
            question: { 
                EN: "The hormone which stimulates secretion of pancreatic enzymes is:",
                HI: "अग्न्याशयी एंजाइमों के स्राव को उत्तेजित करने वाला हार्मोन कौन सा है?"
            },
            options: {
                EN: ["Secretin", "Gastrin", "Cholecystokinin-Pancreozymin", "Enterogastrone"],
                HI: ["सीक्रेटिन", "गास्ट्रिन", "कोलीसिस्टोकाइनिन-पैनक्रियोजाइमिन", "एंटेरोगैस्ट्रोन"]
            },
            correct: 2,
            explanation: {
                EN: "Cholecystokinin-Pancreozymin (CCK-PZ) stimulates the secretion of pancreatic enzymes. It is secreted by I-cells of the duodenum in response to fats and proteins.",
                HI: "कोलीसिस्टोकाइनिन-पैनक्रियोजाइमिन (CCK-PZ) अग्न्याशयी एंजाइमों के स्राव को उत्तेजित करता है। यह वसा और प्रोटीन के जवाब में ग्रहणी की I-कोशिकाओं द्वारा स्रावित होता है।"
            }
        },
        {
            topic: { EN: "Plant Physiology", HI: "पादप कार्यिकी" },
            question: {
                EN: "The primary acceptor of CO2 in C4 plants is:",
                HI: "C4 पौधों में CO2 का प्राथमिक प्रहणकर्ता कौन सा है?"
            },
            options: {
                EN: ["RuBP", "PEP (Phosphoenolpyruvate)", "OAA (Oxaloacetic acid)", "PGA"],
                HI: ["RuBP", "PEP (फास्फोएनोलपायरुवेट)", "OAA (ऑक्जालोएसिटिक एसिड)", "PGA"]
            },
            correct: 1,
            explanation: {
                EN: "Phosphoenolpyruvate (PEP) is the primary 3-carbon CO2 acceptor in C4 plants, catalyzed by the enzyme PEP carboxylase.",
                HI: "फास्फोएनोलपायरुवेट (PEP) C4 पौधों में प्राथमिक 3-कार्बन CO2 स्वीकर्ता है, जो PEP कार्बोक्सिलेज एंजाइम द्वारा उत्प्रेरित होता है।"
            }
        },
        {
            topic: { EN: "Genetics & Evolution", HI: "आनुवंशिकी और विकास" },
            question: {
                EN: "Which of the following nitrogenous bases is NOT present in DNA?",
                HI: "निम्नलिखित में से कौन सा नाइट्रोजन युक्त क्षार DNA में मौजूद नहीं होता है?"
            },
            options: {
                EN: ["Adenine", "Guanine", "Uracil", "Thymine"],
                HI: ["एडेनिन", "गुआनिन", "युरेसिल", "थाइमिन"]
            },
            correct: 2,
            explanation: {
                EN: "Uracil is present only in RNA. DNA contains Thymine instead of Uracil alongside Adenine, Guanine, and Cytosine.",
                HI: "युरेसिल केवल RNA में मौजूद होता है। DNA में एडेनिन, गुआनिन और साइटोसिन के साथ युरेसिल के स्थान पर थाइमिन होता है।"
            }
        }
    ];

    let currentIndex = 0;
    let userAnswers = {};
    let reviewStatus = {};
    let currentLang = 'EN';

    function renderQuestion() {
        const q = questions[currentIndex];
        document.getElementById('topicText').textContent = q.topic[currentLang];
        document.getElementById('qNumText').textContent = `Question ${currentIndex + 1} / ${questions.length}`;
        document.getElementById('questionText').textContent = q.question[currentLang];

        const container = document.getElementById('optionsContainer');
        container.innerHTML = '';
        const letters = ['A', 'B', 'C', 'D'];

        q.options[currentLang].forEach((opt, index) => {
            const item = document.createElement('div');
            item.className = 'option-item';
            if (userAnswers[currentIndex] === index) {
                item.classList.add('selected');
            }

            item.onclick = function() {
                userAnswers[currentIndex] = index;
                renderQuestion();
                updateStats();
            };

            item.innerHTML = `
                <div class="option-letter">${letters[index]}</div>
                <div style="flex:1;">${opt}</div>
                ${userAnswers[currentIndex] === index ? '<div class="check-icon">✓</div>' : ''}
            `;
            container.appendChild(item);
        });

        // Explanation dynamic pop-up
        const expCard = document.getElementById('explanationCard');
        const expBody = document.getElementById('expBody');
        if (userAnswers[currentIndex] !== undefined) {
            expBody.textContent = q.explanation[currentLang];
            expCard.classList.add('visible');
        } else {
            expCard.classList.remove('visible');
        }

        // Navigation state updates
        document.getElementById('btnPrev').disabled = (currentIndex === 0);
        
        const nextBtn = document.getElementById('btnNext');
        if (currentIndex === questions.length - 1) {
            nextBtn.textContent = currentLang === 'EN' ? "Finish" : "समाप्त";
        } else {
            nextBtn.textContent = currentLang === 'EN' ? "Next →" : "अगला →";
        }

        const reviewBtn = document.getElementById('btnReview');
        if (reviewStatus[currentIndex]) {
            reviewBtn.classList.add('reviewed');
            reviewBtn.textContent = currentLang === 'EN' ? "✓ Reviewed" : "✓ समीक्षित";
        } else {
            reviewBtn.classList.remove('reviewed');
            reviewBtn.textContent = currentLang === 'EN' ? "🔖 Mark for Review" : "🔖 समीक्षा के लिए सहेजें";
        }
    }

    function updateStats() {
        const answeredCount = Object.keys(userAnswers).length;
        const total = questions.length;
        const remaining = total - answeredCount;
        const progressPct = Math.round((answeredCount / total) * 100);

        document.getElementById('valAnswered').textContent = answeredCount;
        document.getElementById('valRemaining').textContent = remaining;
        document.getElementById('valProgress').textContent = `${progressPct}%`;

        const circle = document.getElementById('progressCircle');
        circle.style.background = `conic-gradient(var(--accent-green) ${progressPct}%, var(--pill-bg) 0)`;
    }

    // Attach Event Handlers
    document.getElementById('btnNext').onclick = function() {
        if (currentIndex < questions.length - 1) {
            currentIndex++;
            renderQuestion();
        } else {
            alert(currentLang === 'EN' ? "Exam completed!" : "परीक्षा पूरी हुई!");
        }
    };

    document.getElementById('btnPrev').onclick = function() {
        if (currentIndex > 0) {
            currentIndex--;
            renderQuestion();
        }
    };

    document.getElementById('btnReview').onclick = function() {
        reviewStatus[currentIndex] = !reviewStatus[currentIndex];
        renderQuestion();
    };

    document.getElementById('themeBtn').onclick = function() {
        const body = document.body;
        if (body.getAttribute('data-theme') === 'dark') {
            body.setAttribute('data-theme', 'light');
            this.textContent = '☀️';
        } else {
            body.setAttribute('data-theme', 'dark');
            this.textContent = '🌙';
        }
    };

    document.getElementById('langSelect').onchange = function() {
        currentLang = this.value;
        const uiText = {
            EN: {
                expTitle: "Explanation", lblAnswered: "Answered", lblProgress: "Progress", 
                lblRemaining: "Remaining", tabHome: "Home", tabPractice: "Practice", 
                tabTest: "Test", tabAnalysis: "Analysis", tabProfile: "Profile"
            },
            HI: {
                expTitle: "व्याख्या", lblAnswered: "उत्तर दिए", lblProgress: "प्रगति", 
                lblRemaining: "शेष", tabHome: "मुख्य", tabPractice: "अभ्यास", 
                tabTest: "परीक्षण", tabAnalysis: "विश्लेषण", tabProfile: "प्रोफ़ाइल"
            }
        };

        const t = uiText[currentLang];
        document.getElementById('expTitle').textContent = t.expTitle;
        document.getElementById('lblAnswered').textContent = t.lblAnswered;
        document.getElementById('lblProgress').textContent = t.lblProgress;
        document.getElementById('lblRemaining').textContent = t.lblRemaining;

        document.getElementById('tabHome').textContent = t.tabHome;
        document.getElementById('tabPractice').textContent = t.tabPractice;
        document.getElementById('tabTest').textContent = t.tabTest;
        document.getElementById('tabAnalysis').textContent = t.tabAnalysis;
        document.getElementById('tabProfile').textContent = t.tabProfile;

        renderQuestion();
    };

    // Run on startup
    renderQuestion();
    updateStats();
