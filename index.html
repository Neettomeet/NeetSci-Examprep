<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" width="100%" style="max-height: 190px; background: #ffffff;">
  <!-- Stroma Background Fill -->
  <ellipse cx="180" cy="110" rx="150" ry="85" fill="#F1F8E9" stroke="#33691E" stroke-width="3" />

  <ellipse cx="180" cy="110" rx="143" ry="78" fill="none" stroke="#7CB342" stroke-width="1.5" stroke-dasharray="5,3" />

  <!-- Stroma Lamellae (Intergranal thylakoids) -->
  <path d="M 110,95 Q 140,80 170,90" fill="none" stroke="#2E7D32" stroke-width="3" />
  <path d="M 190,130 Q 220,140 250,120" fill="none" stroke="#2E7D32" stroke-width="3" />

  <!-- Granum Stack 1 (Left) -->
  <g fill="#1B5E20" stroke="#0D3B0E" stroke-width="0.8">
    <rect x="95" y="75" width="16" height="8" rx="2" />
    <rect x="95" y="85" width="16" height="8" rx="2" />
    <rect x="95" y="95" width="16" height="8" rx="2" />
    <rect x="95" y="105" width="16" height="8" rx="2" />
  </g>

  <!-- Granum Stack 2 (Center - Target 'Granum') -->
  <g fill="#1B5E20" stroke="#0D3B0E" stroke-width="0.8">
    <rect x="165" y="70" width="18" height="8" rx="2" />
    <rect x="165" y="80" width="18" height="8" rx="2" id="granum-box" />
    <rect x="165" y="90" width="18" height="8" rx="2" />
    <rect x="165" y="100" width="18" height="8" rx="2" />
    <rect x="165" y="110" width="18" height="8" rx="2" />
  </g>

  <!-- Granum Stack 3 (Right) -->
  <g fill="#1B5E20" stroke="#0D3B0E" stroke-width="0.8">
    <rect x="235" y="85" width="16" height="8" rx="2" />
    <rect x="235" y="95" width="16" height="8" rx="2" />
    <rect x="235" y="105" width="16" height="8" rx="2" />
  </g>

  <!-- Starch granule and Lipid droplet (NCERT specific features) -->
  <circle cx="130" cy="130" r="10" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1.5" />
  <text x="122" y="133" font-size="8" fill="#666">Starch</text>

  <circle cx="220" cy="70" r="7" fill="#FFF59D" stroke="#FBC02D" stroke-width="1" />

  <!-- Pointer line matching exact NCERT label convention -->
  <polyline points="174,84 210,40 270,40" fill="none" stroke="#D32F2F" stroke-width="1.5" />
  <circle cx="174" cy="84" r="3" fill="#D32F2F" />
  <text x="275" y="44" font-family="sans-serif" font-size="12" font-weight="bold" fill="#D32F2F">Granum</text>

  <!-- Outer Membrane Label -->
  <polyline points="50,110 30,70 10,70" fill="none" stroke="#333" stroke-width="1" />
  <text x="10" y="65" font-family="sans-serif" font-size="10" fill="#333">Outer membrane</text>
</svg>
