<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NeetSci-Examprep</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-page: #F4F7FB;
            --bg-card: #FFFFFF;
            --text-main: #0F172A;
            --text-sub: #475569;
            --accent-green: #10B981;
            --accent-green-bg: #ECFDF5;
            --accent-green-border: #059669;
            --border-color: #E2E8F0;
            --header-bg: #FFFFFF;
            --pill-bg: #F1F5F9;
            --negative-red: #EF4444;
            --negative-bg: #FEF2F2;
            --card-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.05);
            --font-main: 'Plus Jakarta Sans', -apple-system, sans-serif;
        }

        [data-theme="dark"] {
            --bg-page: #031428;
            --bg-card: #081E36;
            --text-main: #FFFFFF;
            --text-sub: #94A3B8;
            --accent-green: #22C55E;
            --accent-green-bg: #064E3B;
            --accent-green-border: #10B981;
            --border-color: #1E293B;
            --header-bg: #031428;
            --pill-bg: #0F2942;
            --negative-red: #F87171;
            --negative-bg: #450A0A;
            --card-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-main);
            -webkit-tap-highlight-color: transparent;
            transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding-bottom: 80px;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background-color: var(--bg-page);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Top Header */
        header {
            background-color: var(--header-bg);
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
        }

        .brand-title {
            font-size: 1.35rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .brand-title span {
            color: var(--accent-green);
        }

        .brand-subtitle {
            font-size: 0.78rem;
            color: var(--text-sub);
            font-weight: 500;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .select-lang {
            background-color: var(--pill-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            outline: none;
        }

        .theme-toggle-btn {
            background: var(--pill-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            cursor: pointer;
        }

        /* Subject Navigation & Timer */
        .subject-nav {
            padding: 14px 20px 8px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .subject-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-icon {
            font-size: 1.3rem;
            cursor: pointer;
            color: var(--text-main);
        }

        .subject-name {
            font-size: 1.25rem;
            font-weight: 800;
        }

        .subject-topic {
            font-size: 0.82rem;
            color: var(--text-sub);
            font-weight: 600;
        }

        .timer-badge {
            background-color: var(--pill-bg);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 0.88rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Status Banner */
        .status-banner {
            padding: 8px 20px 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .badge-pill {
            background-color: var(--pill-bg);
            color: var(--accent-green);
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.92rem;
            border: 1px solid var(--border-color);
        }

        .marks-group {
            display: flex;
            gap: 8px;
        }

        .mark-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.85rem;
        }

        .mark-plus {
            background-color: var(--accent-green-bg);
            color: var(--accent-green);
            border: 1px solid var(--accent-green);
        }

        .mark-minus {
            background-color: var(--negative-bg);
            color: var(--negative-red);
            border: 1px solid var(--negative-red);
        }

        /* Main Content Container */
        .main-content {
            padding: 0 16px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Question Card */
        .question-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 22px;
            box-shadow: var(--card-shadow);
        }

        .question-text {
            font-size: 1.25rem;
            font-weight: 700;
            line-height: 1.5;
            color: var(--text-main);
            margin-bottom: 20px;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-item {
            background-color: var(--bg-card);
            border: 1.5px solid var(--border-color);
            border-radius: 16px;
            padding: 16px 18px;
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text-main);
            user-select: none;
        }

        .option-letter {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background-color: var(--pill-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1rem;
            flex-shrink: 0;
            color: var(--text-main);
        }

        /* Correct / Wrong Highlight Styles */
        .option-item.correct {
            background-color: var(--accent-green-bg);
            border-color: var(--accent-green-border);
            color: var(--accent-green);
        }

        .option-item.correct .option-letter {
            background-color: var(--accent-green);
            color: #FFFFFF;
        }

        .option-item.wrong {
            background-color: var(--negative-bg);
            border-color: var(--negative-red);
            color: var(--negative-red);
        }

        .option-item.wrong .option-letter {
            background-color: var(--negative-red);
            color: #FFFFFF;
        }

        .check-icon {
            margin-left: auto;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid var(--accent-green);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-green);
            font-weight: 800;
            font-size: 0.85rem;
        }

        .cross-icon {
            margin-left: auto;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid var(--negative-red);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--negative-red);
            font-weight: 800;
            font-size: 0.85rem;
        }

        /* Explanation Box */
        .explanation-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 20px;
            box-shadow: var(--card-shadow);
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }

        .explanation-card.visible {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .explanation-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .explanation-title {
            color: var(--accent-green);
            font-size: 1.1rem;
            font-weight: 800;
        }

        .bulb-icon {
            font-size: 1.4rem;
        }

        .explanation-body {
            font-size: 0.98rem;
            line-height: 1.6;
            color: var(--text-sub);
            font-weight: 500;
        }

        /* Stats Component */
        .stats-grid {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 16px 20px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            align-items: center;
            text-align: center;
            box-shadow: var(--card-shadow);
        }

        .stat-value {
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--accent-green);
        }

        .stat-label {
            font-size: 0.78rem;
            color: var(--text-sub);
            font-weight: 600;
            margin-top: 2px;
        }

        .progress-circle-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .circle-progress {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: conic-gradient(var(--accent-green) 0%, var(--pill-bg) 0);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 4px;
        }

        .circle-inner {
            width: 46px;
            height: 46px;
            background-color: var(--bg-card);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 0.85rem;
        }

        /* Result Summary Modal Card */
        .result-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px;
            text-align: center;
            display: none;
            box-shadow: var(--card-shadow);
        }

        .result-card.visible {
            display: block;
        }

        .result-title {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .result-score {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--accent-green);
            margin: 14px 0;
        }

        .result-stats-row {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            padding: 14px;
            background-color: var(--pill-bg);
            border-radius: 16px;
        }

        .result-stat-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .result-num {
            font-size: 1.2rem;
            font-weight: 800;
        }

        /* Action Buttons */
        .nav-actions {
            display: flex;
            gap: 10px;
            margin-top: 4px;
            margin-bottom: 12px;
        }

        .btn {
            padding: 15px 12px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            flex: 1;
            outline: none;
        }

        .btn-outline {
            background-color: var(--bg-card);
            color: var(--text-main);
        }

        .btn-outline.reviewed {
            border-color: #F59E0B;
            color: #F59E0B;
            background-color: rgba(245, 158, 11, 0.1);
        }

        .btn-primary {
            background-color: var(--accent-green);
            color: #FFFFFF;
            border: none;
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* Bottom Tab Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            background-color: var(--header-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 100;
        }

        .tab-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-sub);
            font-size: 0.75rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
        }

        .tab-item.active {
            color: var(--accent-green);
        }

        .tab-icon {
            font-size: 1.25rem;
        }
    </style>
</head>
